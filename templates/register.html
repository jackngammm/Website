<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HotelMatch — Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 55%, #f9ca24 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: white;
      border-radius: 28px;
      padding: 36px 32px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.2);
    }

    .logo { text-align: center; font-size: 40px; margin-bottom: 4px; }
    h1 { text-align: center; font-size: 26px; font-weight: 800; color: #1a1a1a; margin-bottom: 4px; }
    .subtitle { text-align: center; font-size: 13px; color: #888; margin-bottom: 28px; }

    .toggle-row {
      display: flex;
      background: #f5f5f5;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      gap: 4px;
    }
    .toggle-btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      background: transparent;
      color: #888;
      transition: all 0.2s;
    }
    .toggle-btn.active {
      background: white;
      color: #ee5a24;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .form-section { display: none; }
    .form-section.visible { display: block; }

    .form-group { margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
    input[type="text"], input[type="email"], input[type="password"], input[type="tel"] {
      width: 100%;
      border: 1.5px solid #e8e8e8;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      color: #1a1a1a;
    }
    input:focus { border-color: #ee5a24; }

    .error-msg {
      background: #fff0f0;
      border: 1px solid #ffb3b3;
      color: #cc0000;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      margin-top: 8px;
      transition: transform 0.15s;
    }
    .btn-submit:hover { transform: translateY(-2px); }

    .footer-links {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
    .footer-links a { color: #ee5a24; text-decoration: none; font-weight: 600; }
    .footer-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🏨</div>
    <h1>Create account</h1>
    <p class="subtitle">Join HotelMatch and find your perfect stay</p>

    {% if error %}
    <div class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">
      <div class="toggle-row">
        <button type="button" class="toggle-btn active" id="btnEmail" onclick="switchTab('email')">
          <i class="fas fa-envelope"></i> Email
        </button>
        <button type="button" class="toggle-btn" id="btnPhone" onclick="switchTab('phone')">
          <i class="fas fa-phone"></i> Phone
        </button>
      </div>

      <input type="hidden" name="registration-type" id="regType" value="email">

      <div class="form-section visible" id="emailSection">
        <div class="form-group">
          <label>Username</label>
          <input type="text" name="username" placeholder="Choose a username">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="password" placeholder="Create a password">
        </div>
      </div>

      <div class="form-section" id="phoneSection">
        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" placeholder="Enter your phone number">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" name="otp" placeholder="Create a password">
        </div>
      </div>

      <button type="submit" class="btn-submit">Create Account <i class="fas fa-arrow-right"></i></button>
    </form>

    <div class="footer-links">
      Already have an account? <a href="{{ url_for('login') }}">Log in</a>
      &nbsp;·&nbsp;
      <a href="{{ url_for('home') }}">Home</a>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('regType').value = tab;
      document.getElementById('emailSection').classList.toggle('visible', tab === 'email');
      document.getElementById('phoneSection').classList.toggle('visible', tab === 'phone');
      document.getElementById('btnEmail').classList.toggle('active', tab === 'email');
      document.getElementById('btnPhone').classList.toggle('active', tab === 'phone');
    }
  </script>
</body>
</html>
